name: bula-ai

# =============================================================================
# SERVICES
# =============================================================================
services:
  # ---------------------------------------------------------------------------
  # Infrastructure: PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: ghcr.io/yuussuke/bula_ai_postgres:0.8.1-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bulaai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bulaai}
      POSTGRES_DB: ${POSTGRES_DB:-bulaai}
    ports:
      - "5432:5432"
    volumes:
      # Persist database data between container restarts
      - postgres_data:/var/lib/postgresql/data

  # ---------------------------------------------------------------------------
  # Infrastructure: Qdrant vector database
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.17.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # ---------------------------------------------------------------------------
  # Application: FastAPI backend
  # ---------------------------------------------------------------------------
  api:
    build: ./backend
    tty: true
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - qdrant
    environment:
      # Connection string used by the backend to reach PostgreSQL
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bulaai}:${POSTGRES_PASSWORD:-bulaai}@postgres:5432/${POSTGRES_DB:-bulaai}
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-bulaai}
      PGPASSWORD: ${POSTGRES_PASSWORD:-bulaai}
      PGDATABASE: ${POSTGRES_DB:-bulaai}
      UV_PROJECT_ENVIRONMENT: /tmp/bula-ai-venv

      # Auth / Security
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JSON_LOGS: ${JSON_LOGS:-true}

      # Environment
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SQL_ECHO: ${SQL_ECHO:-false}

      # LLM (Maritaca)
      MARITACA_API_KEY: ${MARITACA_API_KEY}

      # LLM chunking (OpenRouter)
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_CHUNK_MODEL: ${OPENROUTER_CHUNK_MODEL:-google/gemini-3-flash-preview}
      OPENROUTER_CHUNK_FALLBACK_MODEL: ${OPENROUTER_CHUNK_FALLBACK_MODEL:-deepseek/deepseek-v3}
      OPENROUTER_REQUIRE_ZDR: ${OPENROUTER_REQUIRE_ZDR:-true}

      # Dense embeddings
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openrouter}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-jeffh/intfloat-multilingual-e5-large:q8_0}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-60}

      # Local Ollama embedding provider
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal}
      OLLAMA_PORT: ${OLLAMA_PORT:-11434}

      # Vector store
      QDRANT_HOST: ${QDRANT_HOST:-qdrant}
      QDRANT_PORT: ${QDRANT_PORT:-6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_TIMEOUT_SECONDS: ${QDRANT_TIMEOUT_SECONDS:-60}

      # RAG semantic chunking
      PROCESSING_CHUNK_TARGET_TOKENS: ${PROCESSING_CHUNK_TARGET_TOKENS:-600}
      PROCESSING_CHUNK_MIN_TOKENS: ${PROCESSING_CHUNK_MIN_TOKENS:-200}
      PROCESSING_CHUNK_MAX_TOKENS: ${PROCESSING_CHUNK_MAX_TOKENS:-850}
      PROCESSING_CHUNK_OVERLAP_RATIO: ${PROCESSING_CHUNK_OVERLAP_RATIO:-0.12}
      PROCESSING_CHUNK_MAX_CONCURRENCY: ${PROCESSING_CHUNK_MAX_CONCURRENCY:-4}

  # ---------------------------------------------------------------------------
  # Application: PGQueuer ingestion worker
  # ---------------------------------------------------------------------------
  worker:
    build: ./backend
    tty: true
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - qdrant
    command: uv run pgq run app.worker:create_worker --shutdown-on-listener-failure
    restart: always
    environment:
      # Connection string used by the backend to reach PostgreSQL
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bulaai}:${POSTGRES_PASSWORD:-bulaai}@postgres:5432/${POSTGRES_DB:-bulaai}
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-bulaai}
      PGPASSWORD: ${POSTGRES_PASSWORD:-bulaai}
      PGDATABASE: ${POSTGRES_DB:-bulaai}
      UV_PROJECT_ENVIRONMENT: /tmp/bula-ai-venv

      # Auth / Security
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JSON_LOGS: ${JSON_LOGS:-true}

      # Environment
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SQL_ECHO: ${SQL_ECHO:-false}

      # LLM (Maritaca)
      MARITACA_API_KEY: ${MARITACA_API_KEY}

      # LLM chunking (OpenRouter)
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_CHUNK_MODEL: ${OPENROUTER_CHUNK_MODEL:-google/gemini-3-flash-preview}
      OPENROUTER_CHUNK_FALLBACK_MODEL: ${OPENROUTER_CHUNK_FALLBACK_MODEL:-deepseek/deepseek-v3}
      OPENROUTER_REQUIRE_ZDR: ${OPENROUTER_REQUIRE_ZDR:-true}

      # Dense embeddings
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openrouter}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-jeffh/intfloat-multilingual-e5-large:q8_0}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-60}

      # Local Ollama embedding provider
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal}
      OLLAMA_PORT: ${OLLAMA_PORT:-11434}

      # Vector store
      QDRANT_HOST: ${QDRANT_HOST:-qdrant}
      QDRANT_PORT: ${QDRANT_PORT:-6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_TIMEOUT_SECONDS: ${QDRANT_TIMEOUT_SECONDS:-60}

      # RAG semantic chunking
      PROCESSING_CHUNK_TARGET_TOKENS: ${PROCESSING_CHUNK_TARGET_TOKENS:-600}
      PROCESSING_CHUNK_MIN_TOKENS: ${PROCESSING_CHUNK_MIN_TOKENS:-200}
      PROCESSING_CHUNK_MAX_TOKENS: ${PROCESSING_CHUNK_MAX_TOKENS:-850}
      PROCESSING_CHUNK_OVERLAP_RATIO: ${PROCESSING_CHUNK_OVERLAP_RATIO:-0.12}
      PROCESSING_CHUNK_MAX_CONCURRENCY: ${PROCESSING_CHUNK_MAX_CONCURRENCY:-4}
# =============================================================================
# FRONTEND
# =============================================================================
  frontend:
    build: ./frontend
    tty: true
    ports:
      - "3000:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  postgres_data:
  qdrant_data:
