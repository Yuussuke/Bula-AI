name: bula-ai

x-backend-service: &backend-service
  build: ./backend
  tty: true
  env_file:
    - path: ./.env
      required: true
  volumes:
    - ./backend:/app
  depends_on:
    - postgres
    - qdrant
  environment:
    # Docker-only connection overrides. Application settings come from .env.
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bulaai}:${POSTGRES_PASSWORD:-bulaai}@postgres:5432/${POSTGRES_DB:-bulaai}
    PGHOST: postgres
    PGPORT: "5432"
    PGUSER: ${POSTGRES_USER:-bulaai}
    PGPASSWORD: ${POSTGRES_PASSWORD:-bulaai}
    PGDATABASE: ${POSTGRES_DB:-bulaai}
    UV_PROJECT_ENVIRONMENT: /tmp/bula-ai-venv

# =============================================================================
# SERVICES
# =============================================================================
services:
  # ---------------------------------------------------------------------------
  # Infrastructure: PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: ghcr.io/yuussuke/bula_ai_postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bulaai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bulaai}
      POSTGRES_DB: ${POSTGRES_DB:-bulaai}
    ports:
      - "5432:5432"
    volumes:
      # Persist database data between container restarts
      - postgres_data:/var/lib/postgresql/data

  # ---------------------------------------------------------------------------
  # Infrastructure: Qdrant vector database
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.17.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # ---------------------------------------------------------------------------
  # Application: FastAPI backend
  # ---------------------------------------------------------------------------
  api:
    <<: *backend-service
    ports:
      - "8000:8000"

  # ---------------------------------------------------------------------------
  # Application: PGQueuer ingestion worker
  # ---------------------------------------------------------------------------
  worker:
    <<: *backend-service
    command: uv run pgq run app.worker:create_worker --shutdown-on-listener-failure
    restart: always
# =============================================================================
# FRONTEND
# =============================================================================
  frontend:
    build: ./frontend
    tty: true
    ports:
      - "3000:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  postgres_data:
  qdrant_data:
