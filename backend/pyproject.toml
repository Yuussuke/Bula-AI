[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "langchain-community>=0.4.1",
    "langchain-core>=1.4.0",
    "langchain-ollama>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-text-splitters>=1.1.2",
    "openai>=2.36.0",
    "orjson>=3.11.9",
    "pdfplumber>=0.11.9",
    "pgqueuer>=0.26.0",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.12.1",
    "pymupdf>=1.27.2.3",
    "pypdf>=6.13.0",
    "python-multipart>=0.0.28",
    "qdrant-client>=1.18.0,<1.19",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.49",
    "structlog>=25.5.0",
    "tiktoken>=0.12.0",
    "uvicorn[standard]>=0.46.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "asyncpg-stubs>=0.31.2",
    "greenlet>=3.5.0",
    "httpx>=0.28.1",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
    "rich>=15.0.0",
    "ruff>=0.15.12",
    "sacrebleu>=2.6.0",
]

[tool.mypy]
python_version = "3.14"
files = ["app"]
explicit_package_bases = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
pretty = true

[tool.pytest.ini_options]
norecursedirs = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".uv-cache",
    ".venv",
    "htmlcov",
    "tmp",
]
