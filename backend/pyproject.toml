[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.3",
    "langchain-ollama>=0.2.0",
    "langchain-openai>=1.6.2",
    "langchain-text-splitters>=1.1.2",
    "openai>=2.36.0",
    "orjson>=3.12.0",
    "pdfplumber>=0.11.10",
    "pgqueuer>=0.26.0",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.14.0",
    "pymupdf>=1.28.2",
    "pymupdf4llm>=1.28.2",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.1,<1.20",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.0.54",
    "structlog>=25.5.0",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.46.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "asyncpg-stubs>=0.31.3",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "playwright>=1.63.0",
    "psutil>=7.2.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0.0",
    "rich>=15.0.0",
    "ruff>=0.16.8",
    "sacrebleu>=2.6.0",
]

[tool.mypy]
python_version = "3.14"
files = ["app"]
explicit_package_bases = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
pretty = true

[tool.pytest.ini_options]
norecursedirs = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".uv-cache",
    ".venv",
    "htmlcov",
    "tmp",
]
