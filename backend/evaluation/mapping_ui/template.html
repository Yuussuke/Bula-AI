<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Revisão do mapeamento documental</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#182635;font:15px/1.5 system-ui,sans-serif}header,main{max-width:1500px;margin:auto;padding:14px 20px}header{position:sticky;top:0;background:#fff;border-bottom:1px solid #ccd5df;z-index:1}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input,select,button,textarea{font:inherit;padding:7px;border:1px solid #a6b4c3;border-radius:5px}button{cursor:pointer;background:#fff}button.primary{background:#215c83;color:white}textarea{display:block;width:100%;min-height:65px}label{display:block;margin:7px 0}#summary,#message,.muted{font-size:13px;color:#516272}#message{color:#8a3119}.grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(300px,1fr);gap:18px}.panel{background:white;padding:18px;border:1px solid #d5dfe8;border-radius:7px}h2{font-size:21px;margin:8px 0}h3{font-size:16px;margin:18px 0 5px}blockquote{margin:8px 0;padding:10px;border-left:3px solid #5c91b5;background:#f2f6fa;white-space:pre-wrap}pre{font:13px/1.45 ui-monospace,monospace;white-space:pre-wrap;overflow:auto;max-height:380px;background:#f7f8fa;padding:10px}.chunk{border:1px solid #d5dfe8;padding:8px;margin:8px 0}.chunk label{display:flex;gap:10px}.chunk small{overflow-wrap:anywhere}.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px}.checks label{font-size:13px}.checks select{display:block;max-width:100%}details{margin:8px 0}summary{cursor:pointer}.ref{padding:12px 0;border-top:1px solid #d5dfe8}a{color:#145b8a}#navigation{max-width:600px}#export,#import{font-size:13px}#import{max-width:220px}.error{color:#9d2c20;font-weight:600}.risk{color:#8a501b}small{display:block}#record-status{font-weight:600}@media(max-width:900px){.grid{grid-template-columns:1fr}header{position:static}}
</style>
<style>.comparison{display:grid;grid-template-columns:1fr 1.2fr;gap:18px;border-top:1px solid #d5dfe8;padding:14px 0}.comparison>section{min-width:0}.comparison pre{max-height:250px;margin:6px 0}.essential{background:#edf3f8;padding:12px;margin:12px 0}.essential ul{margin:6px 0;padding-left:20px}.quick-panel{margin-bottom:14px}.quick-panel h3{margin-top:0}.detailed-review>summary{padding:12px;background:white;border:1px solid #ccd5df;border-radius:6px}.question{font-size:18px;margin:6px 0}mark{background:#fff0ad;color:inherit}button:disabled{opacity:.5;cursor:default}#queue-note{font-size:12px;color:#516272}@media(max-width:850px){.comparison{grid-template-columns:1fr}}</style>
</head>
<body><header><div class="bar"><label>Revisor <input id="reviewer" aria-label="Revisor" placeholder="Identificador"></label><select id="navigation" aria-label="Registro"></select><button id="previous">←</button><button id="next">→</button><button id="export">Exportar decisões</button><input id="import" type="file" accept="application/json" aria-label="Importar decisões"></div><div id="summary"></div><div id="queue-note"></div><div id="message" role="status"></div></header>
<main><p class="muted">Candidatos automáticos, não golds aprovados. Confira suporte, escopo e qualificadores no PDF original. A revisão anterior da pergunta não aprova este mapeamento.</p><div id="record"></div></main>
<script id="payload" type="application/json">__PAYLOAD__</script><script>__SCRIPT__</script></body></html>
