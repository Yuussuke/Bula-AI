info:
  name: Upload File
  type: http
  seq: 1
  tags:
    - bulas

http:
  method: POST
  url: "{{baseUrl}}/api/v1/bulas/upload"
  body:
    type: multipart-form
    data:
      - name: drug_name
        type: text
        value: ""
      - name: manufacturer
        type: text
        value: ""
      - name: file
        type: text
        value: ""
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 202 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/api/v1/bulas/upload"
      method: POST
      body:
        type: multipart-form
        data:
          - name: drug_name
            type: text
            value: ""
          - name: manufacturer
            type: text
            value: ""
          - name: file
            type: text
            value: ""
    response:
      status: 202
      statusText: Accepted
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "11111111-1111-1111-1111-111111111111",
            "user_id": 1,
            "drug_name": "Dipirona",
            "manufacturer": "Example Pharma",
            "file_url": null,
            "file_address": "stored_objects/11111111-1111-1111-1111-111111111111",
            "qdrant_collection": null,
            "status": "pending",
            "error_message": null,
            "corpus": "private",
            "created_at": "2026-05-05T00:00:00Z",
            "updated_at": "2026-05-05T00:00:00Z"
          }
  - name: 422 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/api/v1/bulas/upload"
      method: POST
      body:
        type: multipart-form
        data:
          - name: drug_name
            type: text
            value: ""
          - name: manufacturer
            type: text
            value: ""
          - name: file
            type: text
            value: ""
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [],
                "msg": "",
                "type": "",
                "input": "",
                "ctx": {}
              }
            ]
          }
