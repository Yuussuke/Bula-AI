name: Postgres Image

permissions:
  contents: read
  packages: write

on:
  pull_request:
    branches: [main]
    paths:
      - "docker/bula_ai_postgres/**"
      - ".github/workflows/postgres-image.yml"
  push:
    branches: [main]
    paths:
      - "docker/bula_ai_postgres/**"
      - ".github/workflows/postgres-image.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: bula_ai_postgres
  IMAGE_CONTEXT: docker/bula_ai_postgres
  DOCKERFILE_PATH: docker/bula_ai_postgres/Dockerfile

jobs:
  metadata:
    name: Resolve image coordinates
    runs-on: ubuntu-latest
    outputs:
      base_image: ${{ steps.image.outputs.base_image }}
      base_tag: ${{ steps.image.outputs.base_tag }}
      image_repository: ${{ steps.image.outputs.image_repository }}
      image_ref: ${{ steps.image.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve mirrored image tag
        id: image
        shell: bash
        run: |
          set -euo pipefail

          from_line="$(grep -m 1 -E '^[[:space:]]*[Ff][Rr][Oo][Mm][[:space:]]+' "$DOCKERFILE_PATH" || true)"
          read -r -a from_parts <<< "$from_line"

          base_image=""
          for from_part in "${from_parts[@]:1}"; do
            if [[ "$from_part" == --* ]]; then
              continue
            fi

            if [[ "${from_part^^}" == "AS" ]]; then
              break
            fi

            base_image="$from_part"
            break
          done

          if [ -z "$base_image" ]; then
            echo "::error::Could not find a FROM image in $DOCKERFILE_PATH."
            exit 1
          fi

          base_without_digest="${base_image%@*}"
          base_name="${base_without_digest##*/}"

          if [[ "$base_name" != *:* ]]; then
            echo "::error::The Postgres image FROM must use an explicit tag."
            exit 1
          fi

          base_tag="${base_name##*:}"

          if [ "$base_tag" = "latest" ]; then
            echo "::error::The Postgres image FROM must not use the latest tag."
            exit 1
          fi

          owner_lowercase="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          image_repository="ghcr.io/${owner_lowercase}/${IMAGE_NAME}"
          image_ref="${image_repository}:${base_tag}"

          {
            echo "base_image=$base_image"
            echo "base_tag=$base_tag"
            echo "image_repository=$image_repository"
            echo "image_ref=$image_ref"
          } >> "$GITHUB_OUTPUT"

  build-amd64:
    name: Build amd64
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Postgres image (amd64)
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.IMAGE_CONTEXT }}
          file: ${{ env.DOCKERFILE_PATH }}
          tags: ${{ needs.metadata.outputs.image_ref }}-amd64
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          cache-from: type=gha,scope=postgres-image-amd64
          cache-to: type=gha,mode=max,scope=postgres-image-amd64

      - name: Verify image capabilities (pull request)
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=postgres \
            --entrypoint verify-postgres-image \
            "${{ needs.metadata.outputs.image_ref }}-amd64"

  build-arm64:
    name: Build arm64
    needs: metadata
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Postgres image (arm64)
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.IMAGE_CONTEXT }}
          file: ${{ env.DOCKERFILE_PATH }}
          tags: ${{ needs.metadata.outputs.image_ref }}-arm64
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          cache-from: type=gha,scope=postgres-image-arm64
          cache-to: type=gha,mode=max,scope=postgres-image-arm64

      - name: Verify image capabilities (pull request)
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=postgres \
            --entrypoint verify-postgres-image \
            "${{ needs.metadata.outputs.image_ref }}-arm64"

  publish-manifest:
    name: Publish multi-arch manifest
    needs: [metadata, build-amd64, build-arm64]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publish multi-arch image tag
        run: |
          docker buildx imagetools create -t "${{ needs.metadata.outputs.image_ref }}" \
            "${{ needs.metadata.outputs.image_ref }}-amd64" \
            "${{ needs.metadata.outputs.image_ref }}-arm64"
