name: Postgres Image

permissions:
  contents: read
  packages: write

on:
  pull_request:
    branches: [main]
    paths:
      - "docker/bula_ai_postgres/**"
      - ".github/workflows/postgres-image.yml"
  push:
    branches: [main]
    paths:
      - "docker/bula_ai_postgres/**"
      - ".github/workflows/postgres-image.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: bula_ai_postgres
  IMAGE_CONTEXT: docker/bula_ai_postgres
  DOCKERFILE_PATH: docker/bula_ai_postgres/Dockerfile
  IMAGE_PLATFORMS: linux/amd64,linux/arm64

jobs:
  postgres-image:
    name: Build Postgres Image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Resolve mirrored image tag
        id: image
        shell: bash
        run: |
          set -euo pipefail

          from_line="$(grep -m 1 -E '^[[:space:]]*[Ff][Rr][Oo][Mm][[:space:]]+' "$DOCKERFILE_PATH" || true)"
          read -r -a from_parts <<< "$from_line"

          base_image=""
          for from_part in "${from_parts[@]:1}"; do
            if [[ "$from_part" == --* ]]; then
              continue
            fi

            if [[ "${from_part^^}" == "AS" ]]; then
              break
            fi

            base_image="$from_part"
            break
          done

          if [ -z "$base_image" ]; then
            echo "::error::Could not find a FROM image in $DOCKERFILE_PATH."
            exit 1
          fi

          base_without_digest="${base_image%@*}"
          base_name="${base_without_digest##*/}"

          if [[ "$base_name" != *:* ]]; then
            echo "::error::The Postgres image FROM must use an explicit tag."
            exit 1
          fi

          base_tag="${base_name##*:}"

          if [ "$base_tag" = "latest" ]; then
            echo "::error::The Postgres image FROM must not use the latest tag."
            exit 1
          fi

          owner_lowercase="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          image_repository="ghcr.io/${owner_lowercase}/${IMAGE_NAME}"
          image_ref="${image_repository}:${base_tag}"

          {
            echo "base_image=$base_image"
            echo "base_tag=$base_tag"
            echo "image_repository=$image_repository"
            echo "image_ref=$image_ref"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        # Required for linux/arm64 on hosted AMD runners during multi-arch pushes.
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # PR: single-arch load + docker run verification (manifest lists cannot be --loaded).
      - name: Build Postgres image (pull request)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.IMAGE_CONTEXT }}
          file: ${{ env.DOCKERFILE_PATH }}
          tags: ${{ steps.image.outputs.image_ref }}
          platforms: linux/amd64
          push: false
          load: true

      - name: Verify image capabilities (pull request)
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=postgres \
            --entrypoint verify-postgres-image \
            "${{ steps.image.outputs.image_ref }}"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch Postgres image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.IMAGE_CONTEXT }}
          file: ${{ env.DOCKERFILE_PATH }}
          tags: ${{ steps.image.outputs.image_ref }}
          platforms: ${{ env.IMAGE_PLATFORMS }}
          push: true
